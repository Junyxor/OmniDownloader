name: OmniDownloader native aria2 + Lux Android APK

on:
  push:
    branches:
      - refactor/aria2-native-core
      - fix/douyin-native-quality-gallery-20261102
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slim-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      # Pin the third-party MIT source to a reviewed commit, not a floating branch.
      - uses: actions/checkout@v4
        with:
          repository: iawia002/lux
          ref: dd00f6d258d80b6684a0b9402d7124e5c18ef42f
          path: vendor/lux
          persist-credentials: false

      - name: Setup Android SDK 34
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Download pinned official aria2 1.37.0 Android ARM64 binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/aria2 app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 'https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-aarch64-linux-android-build1.zip' -o vendor/aria2.zip
          echo "Official archive SHA256:"
          sha256sum vendor/aria2.zip
          unzip -l vendor/aria2.zip
          unzip -q vendor/aria2.zip -d vendor/aria2
          ARIA="$(find vendor/aria2 -type f -name aria2c -print -quit)"
          if [ -z "$ARIA" ]; then echo "aria2c was not found inside official archive"; exit 1; fi
          file "$ARIA"
          # Android executable is installed as an uncompressed JNI lib (extracted at install time).
          cp "$ARIA" app/src/main/jniLibs/arm64-v8a/libaria2c.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libaria2c.so

      - name: Compile pinned MIT Lux extractor for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1 || true)"
          if [ -z "$NDK_DIR" ]; then
            SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            "$SDK_MANAGER" "ndk;27.2.12479018"
            NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android26-clang"
          mkdir -p app/src/main/assets
          cp vendor/lux/LICENSE app/src/main/assets/lux-MIT-LICENSE.txt
          (
            cd vendor/lux
            GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
              CC="$TOOLCHAIN/aarch64-linux-android26-clang" \
              go build -mod=readonly -buildmode=pie -trimpath -ldflags="-s -w" \
                -o ../../app/src/main/jniLibs/arm64-v8a/liblux.so .
          )
          file app/src/main/jniLibs/arm64-v8a/liblux.so
          readelf -h app/src/main/jniLibs/arm64-v8a/liblux.so | head -22

      - name: Unit test and build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify no Python/FFmpeg in APK and report size
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          for flavor in debug release; do
            apk="app/build/outputs/apk/$flavor/app-$flavor.apk"
            unzip -l "$apk" > "reports/apk-$flavor-contents.txt"
            grep -q 'lib/arm64-v8a/libaria2c.so' "reports/apk-$flavor-contents.txt"
            grep -q 'lib/arm64-v8a/liblux.so' "reports/apk-$flavor-contents.txt"
            grep -q 'assets/lux-MIT-LICENSE.txt' "reports/apk-$flavor-contents.txt"
            if grep -E 'libpython|libffmpeg|libqjs|youtubedl' "reports/apk-$flavor-contents.txt"; then
              echo "Unexpected bundled legacy runtime"; exit 1
            fi
            du -h "$apk"
            sha256sum "$apk" >> reports/SHA256SUMS
          done

      - name: Upload installable APKs and audits
        uses: actions/upload-artifact@v4
        with:
          name: OmniDownloader-aria2-native-arm64-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            reports/
          if-no-files-found: error
          retention-days: 14
