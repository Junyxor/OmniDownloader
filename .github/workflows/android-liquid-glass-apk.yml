name: Android Liquid Glass APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/compose-liquid-glass-preview
    paths:
      - '.github/workflows/android-liquid-glass-apk.yml'
      - 'app/**'
      - 'cleaner/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'cleaner/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'

permissions:
  contents: read

jobs:
  apk:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniDownloader-LiquidGlass-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
