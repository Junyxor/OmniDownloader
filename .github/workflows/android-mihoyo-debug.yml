name: Android debug APK - Mihoyo parser

on:
  push:
    branches:
      - feature/mihoyo-parser-language-menu-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 34 SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Test and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniDownloader-mihoyo-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
